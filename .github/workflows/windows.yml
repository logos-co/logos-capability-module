name: Windows

# The unit tests on a real Windows runner, cross-built with a test manifest
# (packages.x86_64-windows.unit-tests), plus the PE gates on the plugin.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: default unit-tests
      tests: true
