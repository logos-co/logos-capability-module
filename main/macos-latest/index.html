dule, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n```"}, {"execs": [{"cmd": "write orchestrator_module/src/orchestrator_module_impl.h", "kind": "file", "note": "Wrote orchestrator_module/src/orchestrator_module_impl.h", "status": "pass"}], "md": "### 2.4 src/orchestrator_module_impl.h \u2014 the class\n\nThree composition paths, all through `modules().greeter_module`:\n`greetThrough`/`greetReport` (sync), `startAsyncGreet`/`asyncGreeting`\n(async), and `subscribeGreeted`/`lastGreetedEvent` (event).\n\n```cpp\n#pragma once\n\n#include <cstdint>\n#include <string>\n\n#include <logos_json.h>            // LogosMap\n#include <logos_module_context.h>  // LogosModuleContext base + modules()\n\n// A caller module. It does nothing on its own \u2014 it composes\n// greeter_module through the typed modules().greeter_module wrapper the\n// builder generates from the dependency declared in metadata.json.\nclass OrchestratorModuleImpl : public LogosModuleContext {\npublic:\n    OrchestratorModuleImpl() = default;\n    ~OrchestratorModuleImpl() = default;\n\n    /// Calls greeter_module.greet(name) and returns its result verbatim.\n    std::string greetThrough(const std::string& name);\n\n    /// Composes several greeter_module calls into one map: a greeting,\n    /// an integer sum, and the greeter's current greet count.\n    LogosMap greetReport(const std::string& name, int64_t a, int64_t b);\n\n    /// Fires greeter_module.greetAsync(name) asynchronously and returns\n    /// \"queued\" immediately; the reply lands in a callback. Read it back\n    /// with asyncGreeting().\n    std::string startAsyncGreet(const std::string& name);\n\n    /// The greeting delivered by startAsyncGreet()'s callback, or empty\n    /// until it arrives.\n    std::string asyncGreeting() const;\n\n    /// Subscribes to greeter_module's `greeted` event with a typed\n    /// callback. Returns \"ok\" once registered.\n    std::string subscribeGreeted();\n\n    /// The last greeting captured by the `greeted` subscription, or\n    /// empty until the event fires.\n    std::string lastGreetedEvent() const;\n\nprivate:\n    std::string m_asyncGreeting;\n    std::string m_lastGreetedEvent;\n    bool        m_subscribed = false;\n};\n```"}, {"execs": [{"cmd": "write orchestrator_module/src/orchestrator_module_impl.cpp", "kind": "file", "note": "Wrote orchestrator_module/src/orchestrator_module_impl.cpp", "status": "pass"}], "md": "### 2.5 src/orchestrator_module_impl.cpp \u2014 the implementation\n\nThe `.cpp` includes the generated `logos_sdk.h` (which defines\n`LogosModules`) \u2014 that's why the cross-module calls live here and not in\nthe header the generator parses. Each method drives `greeter_module`\nthrough the generated wrapper: `.greet(...)` (sync), `.greetAsync(...,\ncb)` (async), `.onGreeted(cb)` (event).\n\n```cpp\n#include \"orchestrator_module_impl.h\"\n\n// Generated at build time by logos-cpp-generator. Defines LogosModules\n// with one std-typed accessor per metadata.json dependency \u2014 here\n// greeter_module. Included only in the .cpp so the impl header the\n// generator parses stays free of Qt and codegen types.\n#include \"logos_sdk.h\"\n\nstd::string OrchestratorModuleImpl::greetThrough(const std::string& name)\n{\n    // The simplest cross-module round-trip: one typed sync call.\n    return modules().greeter_module.greet(name);\n}\n\nLogosMap OrchestratorModuleImpl::greetReport(const std::string& name,\n                                             int64_t a, int64_t b)\n{\n    // Three typed sync calls into greeter_module, composed into one map.\n    auto& greeter = modules().greeter_module;\n    LogosMap report;\n    report[\"greeting\"]   = greeter.greet(name);\n    report[\"sum\"]        = greeter.addInts(a, b);\n    report[\"greetCount\"] = greeter.greetCount();\n    return report;\n}\n\nstd::string OrchestratorModuleImpl::startAsyncGreet(const std::string& name)\n{\n    // The generated async overload returns immediately; the reply is\n    // delivered to the callback on this module's event loop.\n    modules().greeter_module.greetAsync(name, [this](const std::string& g) {\n        m_asyncGreeting = g;\n    });\n    return \"queued\";\n}\n\nstd::string OrchestratorModuleImpl::asyncGreeting() const\n{\n    return m_asyncGreeting;\n}\n\nstd::string OrchestratorModuleImpl::subscribeGreeted()\n{\n    if (m_subscribed) return \"ok\";\n    // Typed subscriber generated from greeter_module's logos_events:\n    // greeted(const std::string&). The accessor is `on` + the\n    // capitalized event name.\n    m_subscribed = modules().greeter_module.onGreeted(\n        [this](const std::string& greeting) {\n            m_lastGreetedEvent = greeting;\n        });\n    return m_subscribed ? \"ok\" : \"failed\";\n}\n\nstd::string OrchestratorModuleImpl::lastGreetedEvent() const\n{\n    return m_lastGreetedEvent;\n}\n```"}, {"execs": [], "md": "## Step 3: Build both modules\n\nNix flakes only see files tracked by git, so initialise a repo in each\nmodule first. Then build each module's `.lgx`. These two modules are the\n**payload**, not the unit under test \u2014 they build against the latest\npublished SDK and builder. (What is pinned to the commit under test is the\ncapability module, wired into the runtime in the next section.)"}, {"execs": [{"cmd": "(cd greeter_module && git init -q && git add -A)\n(cd orchestrator_module && git init -q && git add -A)\n", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 3.1 Initialise git repos\n\nThe greeter is a dependency of the orchestrator, so both must be tracked.\n\n```bash\n(cd greeter_module && git init -q && git add -A)\n(cd orchestrator_module && git init -q && git add -A)\n\n```"}, {"execs": [{"cmd": "nix build 'path:./greeter_module#lgx' -o greeter-lgx\n", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'gith on\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"orchestrator_module\",\"status\":\"not_loaded\",\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"0.1.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"3.0.2\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"}]\n", "status": "pass"}], "md": "### 4.5 Confirm all three modules are present\n\n```bash\nlogosctl module ls\n```"}, {"execs": [], "md": "## Step 5: Load both modules and drive the caller\n\nThe daemon keeps each module's process alive between `call` commands, so an\nevent subscription registered by one call is still active when a later call\ntriggers it, and an async reply lands before the call that reads it."}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module load greeter_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"greeter_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 5.1 Load the greeter (the dependency first)\n\n```bash\nlogosctl module load greeter_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session module load orchestrator_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"orchestrator_module\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 5.2 Load the orchestrator\n\n```bash\nlogosctl module load orchestrator_module\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":20886,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"greeter_module\",\"status\":\"loaded\",\"uptime_seconds\":1,\"version\":\"1.0.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":2,\"version\":\"1.0.0\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":2,\"version\":\"1.0.0\"},{\"name\":\"orchestrator_module\",\"status\":\"loaded\",\"uptime_seconds\":0,\"version\":\"1.0.0\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":2,\"version\":\"0.1.0\"},{\"name\":\"storage_module\",\"status\":\"loaded\",\"uptime_seconds\":2,\"version\":\"3.0.2\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":2,\"version\":\"1.0.0\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":7,\"not_loaded\":0}}\n", "status": "pass"}], "md": "### 5.3 Confirm both report loaded\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call orchestrator_module greetThrough World", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"greetThrough\",\"module\":\"orchestrator_module\",\"result\":\"Hello, World!\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.4 Synchronous cross-module call\n\n`greetThrough(name)` forwards straight to `greeter_module.greet(name)`\nand returns the result \u2014 one typed sync call across the process\nboundary, authorised by the capability layer:\n\n```bash\nlogosctl call orchestrator_module greetThrough World\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call orchestrator_module greetReport Logos 3 5", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"greetReport\",\"module\":\"orchestrator_module\",\"result\":{\"greetCount\":2,\"greeting\":\"Hello, Logos!\",\"sum\":8},\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.5 Compose several calls into one result\n\n`greetReport(name, a, b)` fans out to three greeter calls \u2014 `greet`,\n`addInts`, and `greetCount` \u2014 and returns them as one map. The greeter\nhas now been greeted twice (once above, once here), so `greetCount` is\n`2`:\n\n```bash\nlogosctl call orchestrator_module greetReport Logos 3 5\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call orchestrator_module startAsyncGreet Async", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"startAsyncGreet\",\"module\":\"orchestrator_module\",\"result\":\"queued\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.6 Asynchronous cross-module call\n\n`startAsyncGreet(name)` fires `greeter_module.greetAsync(name)` and\nreturns `\"queued\"` immediately. The reply arrives on the daemon's event\nloop; the next call, `asyncGreeting()`, reads what the callback stashed:\n\n```bash\nlogosctl call orchestrator_module startAsyncGreet Async\n```"}, {"execs": [{"cmd": "sleep 1", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 1\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call orchestrator_module asyncGreeting", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"asyncGreeting\",\"module\":\"orchestrator_module\",\"result\":\"Hello, Async!\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.7 Read the async reply\n\n```bash\nlogosctl call orchestrator_module asyncGreeting\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session call orchestrator_module subscribeGreeted", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"subscribeGreeted\",\"module\":\"orchestrator_module\",\"result\":\"ok\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.8 Subscribe to the greeter's event\n\n`subscribeGreeted()` registers a typed callback on `greeter_module`'s\n`greeted` event. Then `greeter_module.greetNotify(...)` makes the\ngreeter emit it, and `lastGreetedEvent()` reads what the subscription\ncaptured. Because the daemon keeps both modules loaded, the event fires\nbetween the calls:\n\n```bash\nlogosctl call orches st-test-vtfjkfnu/orchestrator-lgx/logos-orchestrator_module-module-lib.lgx\n[2026-10-21 14:30:33.813] [info] [logos] Module loaded: greeter_module\n[2026-10-21 14:30:34.006] [info] [logos] Module loaded: orchestrator_module\n[2026-10-21 14:30:34.321] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal ::eventResponse(QString,QVariantList)\n", "status": "pass"}], "md": "### 5.11 Dump the daemon log\n\n```bash\ncat session/logs/daemon.log || true\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "{\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 5.12 Stop the daemon\n\n```bash\nlogosctl daemon stop\n```"}, {"execs": [{"cmd": "./logos/bin/logosctl --config-dir ./session daemon status || true", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"reason\":\"No daemon running (no local endpoint at /var/folders/n6/hn37q6pj7sj_9dmqqc2113800000gn/T/logos_core_service_f7b9a8e9cf99). A daemon that stopped removes it; start one in this session to get it back.\",\"status\":\"not_running\"}}\n", "status": "pass"}], "md": "### 5.13 Confirm the daemon has stopped\n\n```bash\nlogosctl daemon status\n```"}, {"execs": [], "md": "## Recap\n\n| Composition path | In the orchestrator | Driven via `logosctl` |\n| ---------------- | ------------------- | ---------------------- |\n| Typed **sync** call | `greetThrough()` \u2192 `greeter.greet(...)` | `\"Hello, World!\"` |\n| Composed sync calls | `greetReport()` \u2192 `greet` + `addInts` + `greetCount` | one map of three results |\n| Typed **async** call | `startAsyncGreet()` \u2192 `greetAsync(..., cb)` | `queued`, then `\"Hello, Async!\"` |\n| Typed **event** subscription | `subscribeGreeted()` \u2192 `onGreeted(cb)` | captured `\"Hello, Events!\"` |\n\nEvery module load and every one of these calls was brokered by the\n`capability_module` built from the commit under test. A green run means this\ncapability-module change keeps module loading and inter-module composition \u2014\nexactly what the capability layer gates \u2014 working end to end, so the change\ndoes not break downstream consumers."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
